schema: spec-driven

context: |
  Tech stack: Vite, plain ES modules (no UI framework), vitest + happy-dom.
  Domain: gallery wall planner. Wall plane is modelled in inches at 20 px/inch;
  a 4-corner homography maps it to the screen (design view) or a projector (projection view).
  Pure logic (units, homography, snapping, arrange, hang sheet, share codes) must live in
  DOM-free modules under src/js/ so it can be unit-tested.
  Superpowers output goes to brainstorming/superpowers/, never docs/.

